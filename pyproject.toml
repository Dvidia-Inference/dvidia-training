[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dvidia-training"
version = "0.1.0"
description = "Local CPU training from Skillspace footage, with optional simulation movement candidates"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "third_party/observation-models/*LICENSE.txt"]
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
arm = ["mujoco==3.15.0"]
observations = ["opencv-python==5.0.0.93"]

[project.urls]
Homepage = "https://research.dvidia.org/papers/skillspace-footage-training/"
Repository = "https://github.com/Dvidia-Inference/dvidia-training"
Issues = "https://github.com/Dvidia-Inference/dvidia-training/issues"

[project.scripts]
dvidia-train = "dvidia_training.footage_pipeline:main"
dvidia-training-studio = "dvidia_training.training_studio:main"
dvidia-training-doctor = "dvidia_training.doctor:main"
dvidia-training-benchmark = "dvidia_training.footage_benchmark:main"
dvidia-skill-capsule = "dvidia_training.arm_entrypoints:capsule_main"
dvidia-skillspace-coverage = "dvidia_training.coverage:main"
dvidia-episode-tape = "dvidia_training.episode_tape:main"
dvidia-reaction = "dvidia_training.reaction_benchmark:main"
dvidia-motor-memory = "dvidia_training.motor_benchmark:main"
dvidia-observe = "dvidia_training.observation_pipeline:main"
dvidia-observation-studio = "dvidia_training.observation_studio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dvidia_training = ["*.html", "*.json", "LICENSE", "requirements.lock.txt"]
