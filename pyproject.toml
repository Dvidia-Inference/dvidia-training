[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dvidia-training"
version = "0.1.3.dev1"
description = "Local CPU training from Skillspace footage, with optional simulation movement candidates"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "third_party/observation-models/*LICENSE.txt", "third_party/mujoco/*.txt", "third_party/robot-models/*LICENSE.txt"]
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
arm = ["mujoco==3.15.0"]
usd = ["usd-core==26.11", "mujoco==3.15.0"]
observations = ["opencv-python==5.0.0.93"]

[project.urls]
Homepage = "https://research.dvidia.org/papers/skillspace-footage-training/"
Repository = "https://github.com/Dvidia-Inference/dvidia-training"
Issues = "https://github.com/Dvidia-Inference/dvidia-training/issues"

[project.scripts]
dvidia-train = "dvidia_training.footage_pipeline:main"
dvidia-training-studio = "dvidia_training.training_studio:main"
dvidia-training-doctor = "dvidia_training.doctor:main"
dvidia-training-benchmark = "dvidia_training.footage_benchmark:main"
dvidia-skill-capsule = "dvidia_training.arm_entrypoints:capsule_main"
dvidia-skillspace-coverage = "dvidia_training.coverage:main"
dvidia-episode-tape = "dvidia_training.episode_tape:main"
dvidia-action-demo = "dvidia_training.action_demonstration:main"
dvidia-piper-capture = "dvidia_training.piper_action_capture:main"
dvidia-reaction = "dvidia_training.reaction_benchmark:main"
dvidia-motor-memory = "dvidia_training.motor_benchmark:main"
dvidia-observe = "dvidia_training.observation_pipeline:main"
dvidia-observation-studio = "dvidia_training.observation_studio:main"
dvidia-motion = "dvidia_training.motion_cli:main"
dvidia-transition = "dvidia_training.transition_cli:main"
dvidia-embodiment = "dvidia_training.embodiment_cli:main"
dvidia-reference-task = "dvidia_training.reference_task_benchmark:main"
dvidia-robot-sim = "dvidia_training.robot_profiles:main"
dvidia-piper-task = "dvidia_training.piper_task_benchmark:main"
dvidia-piper-grip = "dvidia_training.piper_grip_benchmark:main"
dvidia-piper-contact = "dvidia_training.piper_contact_benchmark:main"
dvidia-piper-recovery = "dvidia_training.piper_recovery_benchmark:main"
dvidia-piper-reliability = "dvidia_training.piper_reliability_benchmark:main"
dvidia-assets = "dvidia_training.asset_cli:main"
dvidia-scene = "dvidia_training.usd_scene:main"
dvidia-workstation = "dvidia_training.workstation:main"
dvidia-workstation-benchmark = "dvidia_training.workstation_benchmark:main"
dvidia-image-goal = "dvidia_training.image_goal_benchmark:main"
dvidia-local-goal = "dvidia_training.local_goal_benchmark:main"
dvidia-sensor-goal = "dvidia_training.sensor_goal_benchmark:main"
dvidia-prerequisites = "dvidia_training.prerequisite_benchmark:main"
dvidia-grip-benchmark = "dvidia_training.grip_benchmark:main"
dvidia-graspability-benchmark = "dvidia_training.graspability_benchmark:main"
dvidia-video-skill = "dvidia_training.video_goal_install:main"
dvidia-skill-studio = "dvidia_training.video_goal_studio:main"
dvidia-skillspace = "dvidia_training.skillspace_video:main"
dvidia-piper-imitation = "dvidia_training.piper_imitation_benchmark:main"
dvidia-piper-learned = "dvidia_training.piper_learned_skill:main"
dvidia-piper-confirm = "dvidia_training.piper_imitation_driver:main"
dvidia-piper-feedback = "dvidia_training.piper_feedback_benchmark:main"
dvidia-piper-feedback-skill = "dvidia_training.piper_feedback_skill:main"
dvidia-piper-learned-grip = "dvidia_training.piper_learned_grip_benchmark:main"
dvidia-piper-grip-clock = "dvidia_training.piper_grip_clock_cli:main"
dvidia-piper-clock-skill = "dvidia_training.piper_grip_clock_skill:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dvidia_training = ["*.html", "*.json", "*.js", "*.txt", "*.wasm", "video_goal_example.mp4", "LICENSE", "requirements.lock.txt"]
