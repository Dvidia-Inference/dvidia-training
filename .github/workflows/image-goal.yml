name: Image-goal verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: No-key protocol, client, scoring and report checks
        run: >-
          python -m unittest tests.test_jev_client tests.test_image_goal_benchmark
          tests.test_image_goal_freeze tests.test_image_goal_scenes
          tests.test_image_goal_report -v
