name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  visual:
    name: Visual / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed." }
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install visual base
        run: python -m pip install .
      - name: Verify tools and installed entry points
        run: |
          python -m pip check
          ffmpeg -version
          ffprobe -version
          dvidia-train --help
          dvidia-training-studio --help
          dvidia-training-doctor --json
      - name: Test footage, visual training and loopback studio
        run: python -m unittest tests.test_footage_data tests.test_footage_train tests.test_footage_pipeline tests.test_training_studio tests.test_doctor -v

  arm:
    name: Optional arm / Linux / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg and arm extra
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install ".[arm]"
          python -m pip check
      - name: Test native arm and candidate capsule
        run: python -m unittest discover -s tests -v

  container:
    name: Visual CLI container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build CPU image
        run: docker build -t dvidia-training:ci .
      - name: Check CLI with networking disabled
        run: docker run --rm --network none dvidia-training:ci --help
